<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><title>Precision controls at a glance</title><desc>Conceptual control guide — not an interface screenshot</desc><rect width="1600" height="600" fill="#101e2a"/><text x="55" y="76" fill="#e9edf2" font-family="Segoe UI,sans-serif" font-size="44" font-weight="600">Precision controls at a glance</text><text x="55" y="118" fill="#a9bdcb" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Conceptual control guide — not an interface screenshot</text><rect x="55" y="170" width="460" height="300" rx="14" fill="#192f40" stroke="#396175" stroke-width="2"/><text x="77" y="221" fill="#e8b363" font-family="Segoe UI,sans-serif" font-size="31" font-weight="600">01</text><text x="77" y="277" fill="#e9edf2" font-family="Segoe UI,sans-serif" font-size="30" font-weight="600">Move · G</text><text x="77" y="331" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Pick a surface or plane</text><text x="77" y="373" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Constrain with X / Y / Z</text><text x="527" y="312" fill="#56cbd8" font-family="Segoe UI,sans-serif" font-size="32" font-weight="600">→</text><rect x="565" y="170" width="460" height="300" rx="14" fill="#192f40" stroke="#396175" stroke-width="2"/><text x="587" y="221" fill="#e8b363" font-family="Segoe UI,sans-serif" font-size="31" font-weight="600">02</text><text x="587" y="277" fill="#e9edf2" font-family="Segoe UI,sans-serif" font-size="30" font-weight="600">Rotate · R</text><text x="587" y="331" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Choose the rotation axis</text><text x="587" y="373" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Review, then confirm</text><text x="1037" y="312" fill="#56cbd8" font-family="Segoe UI,sans-serif" font-size="32" font-weight="600">→</text><rect x="1075" y="170" width="460" height="300" rx="14" fill="#192f40" stroke="#396175" stroke-width="2"/><text x="1097" y="221" fill="#e8b363" font-family="Segoe UI,sans-serif" font-size="31" font-weight="600">03</text><text x="1097" y="277" fill="#e9edf2" font-family="Segoe UI,sans-serif" font-size="30" font-weight="600">Scale · S</text><text x="1097" y="331" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Set positive X / Y / Z</text><text x="1097" y="373" fill="#b8cbd8" font-family="Segoe UI,sans-serif" font-size="24" font-weight="400">Check proportions</text><text x="55" y="536" fill="#a9bdcb" font-family="Segoe UI,sans-serif" font-size="22" font-weight="400">Enter / LMB: confirm  ·  Esc: cancel preview  ·  Ctrl+Z: undo a completed action</text></svg>